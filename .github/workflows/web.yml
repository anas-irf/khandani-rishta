name: Web

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/api-contract/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - biome.json
      - .github/workflows/web.yml
  pull_request:
    paths:
      - apps/web/**
      - packages/api-contract/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - biome.json
      - .github/workflows/web.yml
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy this commit to production
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm exec biome ci .

      - name: Check the generated API types are current
        run: |
          pnpm generate:api-client
          git diff --exit-code -- packages/api-contract/src/schema.d.ts

      - name: Build
        run: pnpm --filter @khandani/web build

      - name: Check the generated route tree is current
        run: git diff --exit-code -- apps/web/src/routeTree.gen.ts

      - name: Type check
        run: pnpm --filter @khandani/web typecheck

      - name: Test
        run: pnpm --filter @khandani/web test

  deploy-staging:
    name: Deploy to staging
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-26.04
    environment: staging
    concurrency:
      group: deploy-web-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build for staging
        run: pnpm --filter @khandani/web build
        env:
          CLOUDFLARE_ENV: staging
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    name: Deploy to production
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-26.04
    environment: production
    concurrency:
      group: deploy-web-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build for production
        run: pnpm --filter @khandani/web build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
