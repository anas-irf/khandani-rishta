# Android release. Pushing a tag like android-v1.2.0 runs the Android checks, then builds a
# signed release APK and publishes it to R2 (download.khandanirishta.app) and to a GitHub Release.
# Publishing stays off until the repository variable DEPLOY_ENABLED is 'true'.
name: Android release

on:
  push:
    tags: ["android-v*"]

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  check:
    name: Android
    uses: ./.github/workflows/_android.yml

  release:
    name: Publish signed APK
    needs: check
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write # creates the GitHub Release
    steps:
      # Runs before checkout, so nothing from the tagged commit executes until it passes.
      - name: Check the tag is a release from main
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TAG" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags look like android-v1.2.0, got $TAG"
            exit 1
          fi

          # The signing key and Cloudflare token must only reach code that was reviewed and
          # merged. A tag can point at any commit, so require one that is on main.
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)"
          if [ "$status" != behind ] && [ "$status" != identical ]; then
            echo "::error::$TAG points at a commit that is not on main (compare status: $status)."
            exit 1
          fi

          # The version code comes from the run number and the shared "latest" download is
          # overwritten on every release, so an older tag published late would replace a newer
          # release. Only the newest tag may publish. A newer tag also supersedes an older one
          # still waiting in the queue.
          newest="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/android-v" --paginate \
            --jq '.[].ref | ltrimstr("refs/tags/")' | sort -V | tail -n 1)"
          if [ "$newest" != "$TAG" ]; then
            echo "::error::$newest is newer than $TAG, so $TAG is not published."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      # Release builds never restore a shared cache, so a tampered cache can't reach users.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Build the signed release APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          # The Production Clerk instance, shared with the web app. The build refuses a signed
          # APK without a pk_live_ key.
          RELEASE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN_ANDROID }}
        run: |
          # Without google-services.json the app builds without push, so a release must have it.
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo "::error::The ANDROID_GOOGLE_SERVICES_JSON secret is missing, so push would be off."
            exit 1
          fi
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > app/google-services.json
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          ./gradlew assembleRelease --console=plain \
            -PversionCode="$GITHUB_RUN_NUMBER" \
            -PversionName="${GITHUB_REF_NAME#android-v}"
          rm -f "$ANDROID_KEYSTORE_PATH" app/google-services.json

      - name: Name the APK and write its checksum
        run: |
          apk="khandani-rishta-${GITHUB_REF_NAME#android-v}.apk"
          cp apps/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$apk"
          (cd "$RUNNER_TEMP" && sha256sum "$apk" > "$apk.sha256")
          echo "APK=$apk" >> "$GITHUB_ENV"

      # Turns R8-obfuscated stack traces from Sentry back into readable ones.
      - name: Keep the R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-mapping
          path: apps/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: error

      # Wrangler at the version in pnpm-lock.yaml.
      - uses: ./.github/actions/setup-node-pnpm
        with:
          cache: "false"

      - name: Publish to R2 and GitHub Releases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          put() {
            pnpm --filter @khandani/web exec wrangler r2 object put "kr-public/android/$1" --remote "${@:2}"
          }
          # Both names download as the versioned file. The versioned object never changes, so it
          # caches for a year; "latest" is replaced on every release, so it is always revalidated.
          disposition="attachment; filename=\"$APK\""
          apk_type=application/vnd.android.package-archive
          put "$APK" --file "$RUNNER_TEMP/$APK" --content-type "$apk_type" \
            --content-disposition "$disposition" --cache-control "public, max-age=31536000, immutable"
          put "$APK.sha256" --file "$RUNNER_TEMP/$APK.sha256" --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=31536000, immutable"
          put khandani-rishta-latest.apk --file "$RUNNER_TEMP/$APK" --content-type "$apk_type" \
            --content-disposition "$disposition" --cache-control no-cache
          # Safe to re-run: if an earlier attempt failed part way, running the job again finishes
          # the publish instead of failing on a release that already exists.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$APK" "$RUNNER_TEMP/$APK.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/$APK" "$RUNNER_TEMP/$APK.sha256" \
              --verify-tag --title "Android ${GITHUB_REF_NAME#android-v}" --generate-notes
          fi

      # Users only see the release once it is recorded in the admin console (specs/18 ADM-RELEASES),
      # which needs the version code this run gave the build.
      - name: Summarise what to record in the admin console
        run: |
          {
            echo "## Record this release in /admin/releases"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version code | \`$GITHUB_RUN_NUMBER\` |"
            echo "| Version name | \`${GITHUB_REF_NAME#android-v}\` |"
            echo "| Download URL | \`https://download.khandanirishta.app/android/$APK\` |"
            echo "| SHA-256 | \`$(cut -d' ' -f1 "$RUNNER_TEMP/$APK.sha256")\` |"
          } >> "$GITHUB_STEP_SUMMARY"
