name: Android

on:
  push:
    branches: [main]
    tags: ["android-v*"]
    paths:
      - apps/android/**
      - .github/workflows/android.yml
  pull_request:
    paths:
      - apps/android/**
      - .github/workflows/android.yml

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Lint, test and build
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --console=plain

  release:
    name: Publish signed APK
    needs: check
    if: startsWith(github.ref, 'refs/tags/android-v') && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-26.04
    environment: production
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          ./gradlew assembleRelease --console=plain \
            -PversionCode="$GITHUB_RUN_NUMBER" \
            -PversionName="${GITHUB_REF_NAME#android-v}"

      - name: Publish to R2 and GitHub Releases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="khandani-rishta-${GITHUB_REF_NAME#android-v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$apk"
          for key in "android/$apk" "android/khandani-rishta-latest.apk"; do
            npx --yes wrangler@4 r2 object put "kr-public/$key" --file "$RUNNER_TEMP/$apk" \
              --content-type application/vnd.android.package-archive --remote
          done
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/$apk" --title "Android ${GITHUB_REF_NAME#android-v}" --generate-notes
