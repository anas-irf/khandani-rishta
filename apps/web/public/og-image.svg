<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <!-- Static brand image for Open Graph (17 section 13), in the Mehfil Heritage colours and type
       of DESIGN.md. Never a member photo.
       An image cannot load the web fonts, so the type is sized for the wider system serifs.
       Most social networks need a PNG: export this file to /og-image.png (1200 x 630) before launch,
       then point `OG_IMAGE_PATH` in src/features/public/config.ts at it. -->
  <title id="t">Khandani Rishta</title>
  <desc id="d">Rishta, the khandani way. A free, family-first rishta platform.</desc>
