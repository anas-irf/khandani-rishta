packages:
  - apps/web
  - packages/*
allowBuilds:
  esbuild: true
  workerd: true
peerDependencyRules:
  allowedVersions:
    # TypeScript 7 has no compiler API yet, so code generators get TypeScript 6.
    openapi-typescript>typescript: '6'
minimumReleaseAgeExclude:
  - '@cloudflare/kv-asset-handler@0.5.1'
  - '@cloudflare/vite-plugin@1.70.1'
  - '@cloudflare/workers-utils@0.55.0'
  - '@tanstack/react-router-devtools@1.167.4'
  - '@tanstack/react-start-rsc@0.1.68'
  - '@tanstack/react-start@1.169.7'
  - '@tanstack/router-devtools-core@1.168.4'
  - '@tanstack/start-plugin-core@1.172.0'
  - miniflare@5.20261118.0-beta
  - wrangler@4.165.0
