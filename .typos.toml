# Settings for `typos`, the spell check that CI runs on every pull request (see docs/ci-cd.md).
# Fix real mistakes in the text. Add a word here only when it is correct but looks like a
# misspelling to the dictionary.

[default]
# Base64 bodies of PEM keys, such as the throwaway signing key in apps/api/src/test_support.rs.
extend-ignore-re = ["(?s)-----BEGIN [A-Z ]+-----.*?-----END [A-Z ]+-----"]

[default.extend-words]
# Keys are lower case and also cover capitalised and upper case forms.
# Surname and honorific in the Pakistani reference data (specs/05-reference-data.md).
mian = "mian"
# Short for matriculation, the secondary school certificate level.
matric = "matric"
# Bachelor of Arts, in the list of degree abbreviations.
ba = "ba"

[default.extend-identifiers]
# Azure VM size name (2 vCPU, 4 GiB), compared in docs/tech-stack.md section 12.
B2als_v2 = "B2als_v2"

[files]
# Generated from GeoNames: tens of thousands of place names that are not dictionary words.
extend-exclude = ["apps/api/migrations/0012_seed_geography.sql"]
