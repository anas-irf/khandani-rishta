name: Bug report
description: Something doesn't work as it should.
title: "fix: "
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web app, Android app, API, Deploys and infrastructure, Not sure]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Where
      description: Local, staging or production; browser or Android version; app version.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove personal data and secrets first.
