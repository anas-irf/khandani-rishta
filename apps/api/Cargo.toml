[package]
name = "khandani-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
sentry = { version = "0.49.6", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "tracing"] }
sentry-tower = { version = "0.49.6", features = ["http", "axum-matched-path"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["catch-panic", "compression-full", "cors", "request-id", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = "6.0.0"
utoipa-axum = "0.3.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
