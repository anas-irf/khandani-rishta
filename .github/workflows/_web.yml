# Checks for the web app and the shared JavaScript tooling: Biome, type checks, Knip, unit
# tests with coverage, the production build, then Playwright end-to-end tests against that
# build. Called by ci.yml (pull requests) and cd.yml (main, before deploying).
name: Web

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Lint and format (Biome)
        run: pnpm exec biome ci --error-on-warnings .

      - name: Type check
        run: pnpm typecheck

      - name: Unused files, exports and dependencies (Knip)
        run: pnpm knip

      - name: Check the generated API types are current
        run: |
          pnpm generate:api-client
          git diff --exit-code -- packages/api-contract/src/schema.d.ts

      - name: Unit tests
        run: pnpm --filter @khandani/web test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: >-
          node scripts/ci/coverage-summary.mjs apps/web/coverage/coverage-summary.json
          "Web unit test coverage" >> "$GITHUB_STEP_SUMMARY"

      - name: Unit test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: apps/web/test-results/junit.xml
          check_name: Web unit tests
          annotate_only: true
          skip_annotations: true
          detailed_summary: true
          require_tests: false
          fail_on_failure: false

      - name: Build
        run: pnpm build:web

      - name: Check the generated route tree is current
        run: git diff --exit-code -- apps/web/src/routeTree.gen.ts

      # The end-to-end job tests this exact build. `vite preview` finds the built Worker through
      # .wrangler/deploy/config.json, so that file travels with dist/. With two paths the
      # artifact root is their common parent, apps/web/.
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: |
            apps/web/dist/
            apps/web/.wrangler/deploy/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  e2e:
    name: End-to-end tests
    needs: check
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/

      - name: Install Chromium
        run: pnpm --filter @khandani/e2e exec playwright install --with-deps --only-shell chromium

      - name: Run Playwright
        id: playwright
        run: pnpm --filter @khandani/e2e e2e

      - name: End-to-end test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: e2e/playwright-report/junit.xml
          check_name: End-to-end tests
          annotate_only: true
          skip_annotations: true
          detailed_summary: true
          require_tests: false
          fail_on_failure: false

      # HTML report with traces, screenshots and videos of failures. Open it with
      # `pnpm --filter @khandani/e2e e2e:report` after unzipping it into e2e/playwright-report.
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: ${{ steps.playwright.outcome == 'success' && 7 || 30 }}
          overwrite: true
