androidxCore = "1.19.1"
androidxCoreSplashscreen = "1.2.0"
androidxDatastore = "1.3.0"
androidxExifinterface = "1.4.2"
androidxHilt = "1.4.0"
androidxLifecycle = "2.11.1"
androidxNavigation3 = "1.2.2"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
clerk = "1.5.0"
coil = "3.6.3"
