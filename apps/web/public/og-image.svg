  <text x="96" y="328" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="88" fill="#23191D">Rishta, the</text>
  <text x="96" y="428" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="88" fill="#23191D"><tspan font-style="italic" fill="#6E1D34">khandani</tspan> way.</text>
