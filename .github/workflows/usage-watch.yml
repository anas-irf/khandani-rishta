# Daily free-tier check: R2 storage and operations, Workers requests, and renewal dates
# (scripts/ci/usage-watch.mjs). R2 bills the card on file past its free tier and Cloudflare's
# own usage alerts need a paid plan, so this run fails when anything reaches its warning level,
# and GitHub emails the repository owner. Azure has its own alerts (infra/azure/README.md).
# Also runnable from the Actions tab.
name: Usage watch

on:
  schedule:
    - cron: "41 3 * * *" # Every day, 03:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usage-watch
  cancel-in-progress: true

jobs:
  check:
    name: Free-tier usage
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Check usage and dates
        env:
          # Read-only token: Account > Account Analytics > Read, nothing else.
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci/usage-watch.mjs
